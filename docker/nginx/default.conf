server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app calls the pipeline same-origin: /api/... -> pipeline
    location /api/ {
        proxy_pass http://pipeline:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 30m;
        proxy_read_timeout 300s;
    }

    # SPA fallback (Flutter web is a single page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
