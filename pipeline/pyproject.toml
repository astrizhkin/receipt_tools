[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phunter"
version = "0.1.0"
description = "price_hunter receipt OCR pipeline (LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.49.1",  # FileResponse Range-parsing DoS fix (CVE-2025-62727)
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "langgraph>=1.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pillow>=10",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
pythonpath = ["src"]
